# healthcare-api-sync を自分の private リポジトリから実行するための呼び出しワークフロー雛形
#
# 使い方(詳細は healthcare-api-sync の README を参照):
#   1. private リポジトリを作成する
#      例: gh repo create <owner>/healthcare-api-sync-runner --private
#   2. このファイルを private リポジトリの .github/workflows/sync.yml として push する
#      (ファイル名を変える場合は keepalive ジョブ内のパスも合わせて変える)
#   3. healthcare-api-sync 側のスクリプトで Secrets を登録する
#      ./scripts/setup_github_secrets.sh --repo <owner>/healthcare-api-sync-runner
#   4. (推奨) fine-grained PAT を Secret GH_PAT に登録する(README 参照)
#
# 実行履歴・ログ・トークンのキャッシュはすべてこの private リポジトリ側に保存される。
name: sync

on:
  schedule:
    # 毎日 15:00 JST に自動実行(cron は UTC 基準のため 6時 = 15時-9時間)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "同期する日付(YYYY-MM-DD)。省略時は直近N日分"
        required: false
        default: ""
      days:
        description: "直近何日分を同期するか。省略時は config の default_days"
        required: false
        default: ""
      dry_run:
        description: "書き込まずに同期対象のみ確認する"
        type: boolean
        required: false
        default: false

# トークンのリフレッシュ競合を避けるため直列実行にする(実行中のものは止めない)
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    uses: elixir-sh/healthcare-api-sync/.github/workflows/sync.yml@main
    with:
      # schedule 実行では inputs が空になり、reusable workflow 側で「未指定」として扱われる
      date: ${{ inputs.date || '' }}
      days: ${{ inputs.days || '' }}
      dry_run: ${{ inputs.dry_run == true }}
      # fork を使う場合はここで自分の fork とブランチを指定する
      # code_repository: <owner>/healthcare-api-sync
      # code_ref: main
    secrets:
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
      GOOGLE_HEALTH_TOKEN_JSON: ${{ secrets.GOOGLE_HEALTH_TOKEN_JSON }}
      HEALTHPLANET_TOKEN_JSON: ${{ secrets.HEALTHPLANET_TOKEN_JSON }}
      GH_PAT: ${{ secrets.GH_PAT }}

  # GitHub の仕様で、60日間コミット等の操作がないリポジトリは schedule が自動停止される。
  # このリポジトリはワークフローを置くだけでコミットがほぼ発生しないため、
  # 実行のたびに workflow を enable し直して停止タイマーをリセットする
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: schedule の自動停止タイマーをリセット
        env:
          GH_TOKEN: ${{ github.token }}
        # パス末尾はこのワークフローのファイル名(変えた場合はここも変える)
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
